<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Everlume Operations Desk</title>
  <link rel="stylesheet" href="ops.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to dashboard</a>
  <header class="topbar">
    <div class="brand"><img class="mark" src="../assets/everlume-mark-v3.svg" alt="Everlume EL mark" width="42" height="42"><span>EVERLUME <small>OPERATIONS DESK</small></span></div>
    <div class="header-tools">
      <span class="connection-state" id="connectionState"><i aria-hidden="true"></i> Initializing secure view</span>
      <span class="synthetic-badge" id="modeBadge">NO CLIENT DATA LOADED</span>
      <span class="role-picker" id="identity">Signed out</span>
    </div>
  </header>
  <div class="shell">
    <nav class="sidebar" aria-label="Operations modules">
      <button class="nav-item active" data-view="overview">Today <span>01</span></button>
      <button class="nav-item" data-view="orders">Orders &amp; preorders <span>02</span></button>
      <button class="nav-item" data-view="inventory">Inventory <span>03</span></button>
      <button class="nav-item" data-view="income">Income <span>04</span></button>
      <button class="nav-item" data-view="expenses">Expenses <span>05</span></button>
      <button class="nav-item" data-view="catalog">Catalog registry <span>06</span></button>
      <button class="nav-item" data-view="exceptions">Exceptions <span>07</span></button>
      <button class="nav-item" data-view="handoffs">Handoffs &amp; access <span>08</span></button>
      <button class="nav-item" data-view="affiliates">Affiliate pilot <span>09</span></button>
      <button class="nav-item" data-view="shipping">Shipping <span>10</span></button>
      <div class="sidebar-note" id="sidebarNote"><strong>Read-only operations desk</strong><br>Connecting to the governed source.</div>
    </nav>
    <main id="main" tabindex="-1" aria-live="polite"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="../js/runtime-config.js"></script>
  <script src="../vendor/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="ops.js"></script>
</body>
</html>
