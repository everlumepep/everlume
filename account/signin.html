<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Everlume — Sign in</title>
  <link rel="icon" type="image/svg+xml" href="../assets/everlume-mark-v3.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../premium-theme.css">
  <link rel="stylesheet" href="../portal.css">
</head>
<body>
  <main class="portal-shell">
    <div class="portal-card">
      <p class="eyebrow">My Everlume</p>
      <h1 id="authTitle">Sign in</h1>
      <p class="lead" id="authLead">Access your orders, rewards, and account details.</p>
      <form id="authForm">
        <label id="nameField" hidden>First name<input name="first_name" autocomplete="given-name"></label>
        <label>Email<input type="email" name="email" required autocomplete="email"></label>
        <label id="passwordField">Password<input type="password" name="password" autocomplete="current-password" minlength="8"></label>
        <p class="form-status" id="authStatus" role="status" aria-live="polite"></p>
        <button class="btn btn-dark" type="submit" id="authSubmit">Sign in</button>
      </form>
      <p class="portal-switch">
        <span id="switchToSignup">New to Everlume? <button type="button" data-mode="signup">Create an account</button></span>
        <span id="switchToSignin" hidden>Already have an account? <button type="button" data-mode="signin">Sign in</button></span>
        <br><button type="button" data-mode="reset" id="forgotLink">Forgot password?</button>
      </p>
      <p class="portal-notice" id="configNotice" hidden>Accounts are not yet enabled on this preview — the Supabase backend has not been connected. This page will activate once the platform backend is configured.</p>
      <p class="portal-switch"><a href="../index.html">← Back to Everlume</a></p>
    </div>
  </main>
  <script src="../vendor/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
