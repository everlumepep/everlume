<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Everlume — Choose a new password</title>
  <link rel="icon" type="image/png" href="../assets/everlume-logo-client-monogram.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../premium-theme.css">
  <link rel="stylesheet" href="../portal.css">
</head>
<body>
  <main class="portal-shell">
    <div class="portal-card">
      <p class="eyebrow">My Everlume</p>
      <h1>Choose a new password</h1>
      <p class="lead">Enter a new password for your Everlume account.</p>
      <form id="resetForm">
        <label>New password<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
        <label>Confirm password<input type="password" name="confirm" required minlength="8" autocomplete="new-password"></label>
        <p class="form-status" id="resetStatus" role="status" aria-live="polite"></p>
        <button class="btn btn-dark" type="submit">Update password</button>
      </form>
      <p class="portal-switch"><a href="signin.html">← Back to sign in</a></p>
    </div>
  </main>
  <script src="../js/runtime-config.js"></script>
  <script src="../vendor/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/reset.js"></script>
</body>
</html>
